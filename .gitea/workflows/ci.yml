name: CI

# Gitea is the primary forge; GitHub is a read-only push mirror that only publishes releases.
# Stdlib-only: Home Assistant is not needed to check the local patches.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: python3 -m compileall -q custom_components
      - run: python3 -m unittest discover tests -v
      - name: Manifest and hacs.json parse
        run: |
          python3 -c "import json; json.load(open('custom_components/blueiris/manifest.json')); h=json.load(open('hacs.json')); assert not h.get('zip_release'), 'release.yml builds no zip'"
